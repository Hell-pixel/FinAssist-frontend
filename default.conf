server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    client_max_body_size 50M;
    
    include /etc/nginx/default.d/*.conf;
    
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api-proxy {
        rewrite /api-proxy/(.*) /$1  break;
        proxy_pass https://api.tracker.yandex.net;
        proxy_redirect off;
        proxy_set_header Host api.tracker.yandex.net;
        proxy_pass_request_headers on;
    }

    location /login-proxy {
        rewrite /login-proxy/(.*) /$1  break;
        proxy_pass https://login.yandex.ru;
        proxy_redirect off;
        proxy_set_header Host login.yandex.ru;
        proxy_pass_request_headers on;
    }

    error_page  404 /;
}
